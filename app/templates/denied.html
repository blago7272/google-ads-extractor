<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied | Google Ads Signal Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/reporting.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="hero" style="display:block; text-align:center; padding-top:80px;">
        <h1>Access Denied</h1>
        {% if email %}
          <p style="color:var(--muted); margin-top:12px;">
            <strong>{{ email }}</strong> does not have access to the reporting app.
          </p>
        {% endif %}
        <p style="color:var(--muted); margin-top:8px;">
          Contact your account manager to request access.
        </p>
        <p style="margin-top:32px;">
          <a href="/auth/login" style="color:var(--accent); font-weight:500;">Try a different account</a>
        </p>
      </header>
    </div>
  </body>
</html>
