# Environment for the reporting release orchestrator Cloud Run Job.
#
# THIS FILE IS THE COMPLETE ENVIRONMENT. `gcloud run jobs deploy --env-vars-file`
# removes every existing environment variable before applying it, so any variable
# missing here is DELETED from the live job.
#
# It is only read by the `provision` mode of deploy_release_orchestrator.sh, which
# refuses to run against an existing job unless FORCE=1. Normal deploys use
# `release` mode, which is image-only and never reads this file.
#
# Before provisioning over an existing job, diff this against live:
#   gcloud run jobs describe reporting-release-orchestrator \
#     --project=gads-export-all --region=europe-west1 \
#     --format='value(spec.template.spec.template.spec.containers[0].env)'
#
# SECRETS ARE NOT SETTABLE HERE. TELEGRAM_BOT_TOKEN is bound separately via
# --set-secrets in the deploy script's provision mode. Never add a token as a
# literal value in this file -- it would put the secret in git.

DBT_PROJECT_ID: "gads-export-all"
CFG_DATASET: "gads_reporting_cfg"
CFG_ACCOUNTS_TABLE: "cfg_accounts"
RAW_DATASET: "gads_raw"
RAW_ACCOUNT_STATS_PATTERN: "p_ads_AccountStats_*"

# Accounts lagging more than this many days are classified stale by
# stg_account_freshness and excluded from every mart.
#
# MUST NOT BE 0. The Google Ads transfer always lands at least a day behind, so a
# threshold of 0 marks EVERY account stale. The marts inner-join healthy_accounts,
# so they would all rebuild empty -- and because the freshness gate is
# non-blocking and dbt tests pass vacuously on empty tables, nothing would fail.
# The reporting layer would simply go dark.
#
# 3 is the live production value.
RAW_FRESHNESS_MAX_ALLOWED_LAG_DAYS: "3"

DBT_BIN: "dbt"
DBT_PROJECT_DIR: "/app"
DBT_PROFILES_DIR: "/app/profiles"
STAGE_DBT_TARGET: "stage"
PROD_DBT_TARGET: "prod"
DBT_RUN_SEEDS: "false"
DBT_STAGING_SELECT: "path:models/staging/google_ads path:models/staging/manual"
DBT_MART_SELECT: "path:models/marts/reporting"
DBT_TEST_SELECT: ""
