version: 2

# NOTE ON TEST STYLE
# Required-column checks use the project's `not_null_columns` generic test rather
# than one `not_null` per column. dbt issues one query per test, so N per-column
# tests re-scan the model N times -- on the fact staging views that alone was
# ~60 GB per build. Coverage is identical; failing rows name the offending columns
# in `null_columns`. Column-specific tests (unique, accepted_values) stay inline.

models:
  - name: stg_account_stats_daily
    description: Daily account-level metrics normalized from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [transfer_source, account_id, report_date, impressions, clicks]

  - name: stg_campaign_stats_daily
    description: Daily campaign-level metrics normalized from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, report_date]

  - name: stg_campaign_stats_hourly
    description: Hourly campaign-level metrics normalized from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, report_date, report_hour]

  - name: stg_ad_group_stats_daily
    description: Daily ad group-level metrics normalized from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, report_date]

  - name: stg_ad_group_stats_hourly
    description: Hourly ad group-level metrics normalized from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, report_date, report_hour]

  - name: stg_budget_stats_daily
    description: Daily campaign budget perspective from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, campaign_budget_id, report_date]

  - name: stg_campaign_dimension_latest
    description: Latest campaign dimension state per account and transfer source.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, campaign_name]

  - name: stg_ad_group_dimension_latest
    description: >
      Latest ad group dimension state per account and transfer source. Accumulating
      incremental table: each run merges only the last `dimension_snapshot_lookback_days`
      of raw daily snapshots onto the stored state, instead of rescanning the full
      `p_ads_AdGroup_*` snapshot history. Ad groups that stop appearing in recent
      snapshots retain their last-known attributes.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, ad_group_name]

  - name: stg_keyword_dimension_latest
    description: >
      Latest keyword dimension state per account and transfer source. Accumulating
      incremental table: each run merges only the last `dimension_snapshot_lookback_days`
      of raw daily snapshots onto the stored state, instead of rescanning the full
      `p_ads_Keyword_*` snapshot history. Keywords that stop appearing in recent
      snapshots retain their last-known attributes.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, keyword_id]

  - name: stg_keyword_performance_daily
    description: Daily keyword performance fact used by the keyword audit.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, keyword_id, report_date]

  - name: stg_account_fx_rates_daily
    description: >
      Daily account-level EUR exchange rates resolved from the ECB table with a CSV
      seed fallback. Materialized as a TABLE: ten marts join to it, and as a view each
      one inlined the whole definition, making it 70% of the pipeline's scan volume.
      The (account_id, report_date) grain comes from a dense date spine starting at
      `fx_spine_start_date`, guarded by
      `stg_account_fx_rates_daily_covers_reported_dates`.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, currency, report_date, eur_exchange_rate]

  - name: stg_account_freshness
    description: >
      Per-account raw-data freshness classification for the current run. Healthy
      accounts have lag <= RAW_FRESHNESS_MAX_ALLOWED_LAG_DAYS; stale accounts are
      excluded from mart builds.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, client_id, account_name, freshness_status]
    columns:
      - name: account_id
        tests: [unique]
      - name: freshness_status
        tests:
          - accepted_values:
              arguments:
                values: ['healthy', 'stale']

  - name: stg_exchange_rates_latest
    description: Latest configured EUR exchange rate per currency.
    tests:
      - not_null_columns:
          arguments:
            columns: [currency, eur_exchange_rate]

  - name: stg_ad_dimension_latest
    description: >
      Latest ad dimension state per account and transfer source. Accumulating
      incremental table: each run merges only the last `dimension_snapshot_lookback_days`
      of raw daily snapshots onto the stored state, instead of rescanning the full
      `p_ads_Ad_*` snapshot history. Ads that stop appearing in recent snapshots
      retain their last-known attributes.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, ad_id, ad_label]

  - name: stg_ad_stats_daily
    description: Daily ad performance fact normalized from the Google Ads transfer.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, ad_id, report_date]

  - name: stg_search_query_stats_daily
    description: Daily search term performance fact used by the search terms report.
    tests:
      - not_null_columns:
          arguments:
            columns: [account_id, campaign_id, ad_group_id, search_term]
