version: 2

models:
  - name: stg_account_stats_daily
    description: Daily account-level metrics normalized from the Google Ads transfer.
    columns:
      - name: transfer_source
        tests: [not_null]
      - name: account_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: impressions
        tests: [not_null]
      - name: clicks
        tests: [not_null]

  - name: stg_campaign_stats_daily
    description: Daily campaign-level metrics normalized from the Google Ads transfer.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]

  - name: stg_campaign_stats_hourly
    description: Hourly campaign-level metrics normalized from the Google Ads transfer.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: report_hour
        tests:
          - not_null

  - name: stg_ad_group_stats_daily
    description: Daily ad group-level metrics normalized from the Google Ads transfer.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]

  - name: stg_ad_group_stats_hourly
    description: Hourly ad group-level metrics normalized from the Google Ads transfer.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: report_hour
        tests: [not_null]

  - name: stg_budget_stats_daily
    description: Daily campaign budget perspective from the Google Ads transfer.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: campaign_budget_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]

  - name: stg_campaign_dimension_latest
    description: Latest campaign dimension state per account and transfer source.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: campaign_name
        tests: [not_null]

  - name: stg_ad_group_dimension_latest
    description: Latest ad group dimension state per account and transfer source.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: ad_group_name
        tests: [not_null]

  - name: stg_keyword_dimension_latest
    description: >
      Latest keyword dimension state per account and transfer source. Accumulating
      incremental table: each run merges only the last `dimension_snapshot_lookback_days`
      of raw daily snapshots onto the stored state, instead of rescanning the full
      `p_ads_Keyword_*` snapshot history. Keywords that stop appearing in recent
      snapshots retain their last-known attributes.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: keyword_id
        tests: [not_null]

  - name: stg_keyword_performance_daily
    description: Daily keyword performance fact used by the keyword audit.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: keyword_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]

  - name: stg_account_fx_rates_daily
    description: Daily account-level EUR exchange rates resolved from the reporting FX seed.
    columns:
      - name: account_id
        tests: [not_null]
      - name: currency
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: eur_exchange_rate
        tests: [not_null]

  - name: stg_account_freshness
    description: Per-account raw-data freshness classification for the current run. Healthy accounts have lag <= RAW_FRESHNESS_MAX_ALLOWED_LAG_DAYS; stale accounts are excluded from mart builds.
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: client_id
        tests: [not_null]
      - name: account_name
        tests: [not_null]
      - name: freshness_status
        tests:
          - not_null
          - accepted_values:
              values: ['healthy', 'stale']

  - name: stg_exchange_rates_latest
    description: Latest configured EUR exchange rate per currency.
    columns:
      - name: currency
        tests: [not_null]
      - name: eur_exchange_rate
        tests: [not_null]

  - name: stg_ad_dimension_latest
    description: >
      Latest ad dimension state per account and transfer source. Accumulating
      incremental table: each run merges only the last `dimension_snapshot_lookback_days`
      of raw daily snapshots onto the stored state, instead of rescanning the full
      `p_ads_Ad_*` snapshot history. Ads that stop appearing in recent snapshots
      retain their last-known attributes.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: ad_id
        tests: [not_null]
      - name: ad_label
        tests: [not_null]

  - name: stg_ad_stats_daily
    description: Daily ad performance fact normalized from the Google Ads transfer.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: ad_id
        tests: [not_null]
      - name: report_date
        tests: [not_null]

  - name: stg_search_query_stats_daily
    description: Daily search term performance fact used by the search terms report.
    columns:
      - name: account_id
        tests: [not_null]
      - name: campaign_id
        tests: [not_null]
      - name: ad_group_id
        tests: [not_null]
      - name: search_term
        tests: [not_null]
      - name: report_date
        tests: [not_null]
