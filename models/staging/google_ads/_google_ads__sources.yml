version: 2

sources:
  - name: reporting_cfg
    database: "{{ var('raw_project_id', target.project) }}"
    schema: gads_reporting_cfg
    tables:
      - name: ecb_exchange_rates_daily
        description: >
          Daily ECB reference exchange rates loaded by scripts/fx_rates_backfill.py.
          Contains one row per (currency, report_date) with the ECB rate and its EUR inverse.
          Partitioned by report_date, clustered by currency.
        columns:
          - name: currency
            description: ISO currency code (EUR, USD, GBP, RON, MXN, BGN)
          - name: report_date
            description: Business date of the rate
          - name: eur_exchange_rate
            description: "Inverse ECB rate: 1 unit of currency = X EUR"
      - name: ops_account_freshness
        description: >
          Per-run, per-account freshness verdicts written by the release orchestrator
          (orchestration/raw_freshness.py) before dbt runs. Append-only audit trail:
          one row per active account per release. stg_account_freshness reads the
          current run's rows. Partitioned by run_timestamp (day), clustered by account_id.
        columns:
          - name: run_timestamp
            description: The release's execution timestamp; identifies the run.
          - name: report_date
            description: Today in report_timezone at run time; lag is measured from it.
          - name: lag_days
            description: report_date - last_raw_date. NULL when the account has no raw data.
          - name: status
            description: "'healthy' (built into the marts) or 'stale' (excluded): stale when lag_days > max_allowed_lag_days or there is no raw data."
