version: 2

seeds:
  - name: cfg_accounts
    description: Managed account registry for the reporting layer.
    columns:
      - name: client_id
        tests: [not_null]
      - name: account_id
        tests: [not_null, unique]
      - name: account_name
        tests: [not_null]
      - name: timezone
        tests: [not_null]
      - name: currency
        tests: [not_null]

  - name: cfg_account_groups
    description: Named groups of accounts used for rollups.
    columns:
      - name: group_id
        tests: [not_null]
      - name: account_id
        tests: [not_null]

  - name: cfg_thresholds
    description: Thresholds used by alerting and audit logic.
    columns:
      - name: client_id
        tests: [not_null]
      - name: threshold_key
        tests: [not_null]
      - name: threshold_value
        tests: [not_null]

  - name: cfg_exchange_rates
    description: Configurable EUR exchange rates used to convert native account currency into reporting EUR metrics.
    columns:
      - name: currency
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: eur_exchange_rate
        tests: [not_null]

models:
  - name: mart_skipped_accounts
    description: Accounts excluded from the current mart build due to stale raw data. Use this to understand which accounts were skipped and why.
    columns:
      - name: client_id
        data_type: string
        tests: [not_null]
      - name: account_id
        data_type: string
        tests: [not_null, unique]
      - name: account_name
        data_type: string
        tests: [not_null]
      - name: last_raw_date
        data_type: date
      - name: days_lag
        data_type: int64
      - name: freshness_status
        data_type: string
        tests: [not_null]
      - name: exclusion_reason
        data_type: string
        tests: [not_null]
      - name: evaluated_at
        data_type: timestamp
        tests: [not_null]

  - name: mart_ads_overview_daily
    description: Daily account overview mart for the HTML overview page.
    columns:
      - name: client_id
        data_type: string
        tests: [not_null]
      - name: account_id
        data_type: string
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cfg_accounts')
                field: account_id
      - name: account_name
        data_type: string
        tests: [not_null]
      - name: timezone
        data_type: string
        tests: [not_null]
      - name: currency
        data_type: string
        tests: [not_null]
      - name: report_date
        data_type: date
        tests: [not_null]
      - name: cost_original
        data_type: float64
      - name: cost_eur
        data_type: float64
      - name: clicks
        data_type: int64
      - name: impressions
        data_type: int64
      - name: conversions
        data_type: float64
      - name: conversion_value_original
        data_type: float64
      - name: conversion_value_eur
        data_type: float64
      - name: ctr
        data_type: float64
      - name: cpc_original
        data_type: float64
      - name: cpc_eur
        data_type: float64
      - name: cpa_original
        data_type: float64
      - name: cpa_eur
        data_type: float64
      - name: roas
        data_type: float64

  - name: mart_ads_overview_monthly
    description: Monthly rollup for high-level audit summaries.
