name: google_ads_extractor
version: 0.1.0
config-version: 2
profile: google_ads_extractor

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raw_project_id: "gads-export-all"
  raw_dataset: "gads_raw"
  report_timezone: "Europe/Sofia"

models:
  google_ads_extractor:
    staging:
      +schema: gads_reporting_stg
      +materialized: view
    marts:
      +schema: gads_reporting_mart
      +materialized: table
      +contract:
        enforced: true

seeds:
  google_ads_extractor:
    +schema: gads_reporting_cfg
    +quote_columns: false
    cfg_accounts:
      +column_types:
        client_id: string
        account_id: string
        account_name: string
        timezone: string
        currency: string
        is_active: boolean
        has_auction_insights: boolean
        has_ga4: boolean
        notes: string
    cfg_account_groups:
      +column_types:
        group_id: string
        account_id: string
        notes: string
    cfg_thresholds:
      +column_types:
        client_id: string
        threshold_key: string
        threshold_value: float64
        notes: string
    cfg_exchange_rates:
      +column_types:
        currency: string
        valid_from: date
        eur_exchange_rate: float64
        rate_source: string
        notes: string
    cfg_segments:
      +column_types:
        client_id: string
        entity_level: string
        entity_id: string
        segment_label: string
        notes: string
